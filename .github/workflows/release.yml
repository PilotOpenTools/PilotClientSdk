name: Release

# Тег vX.Y.Z: проверка версии, сборка, тесты и GitHub Release с zip модуля, NuGet-пакетом и контрольными суммами.
# Описание релиза - раздел версии из CHANGELOG.md; без него workflow падает.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write # GitHub Packages: пакет Pilot.ClientSdk в nuget.pkg.github.com/PilotOpenTools
  id-token: write # Trusted Publishing nuget.org: временный ключ API по токену OIDC, секрет не хранится

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      # Тег должен совпадать с <Version> в Pilot.ClientSdk.csproj, иначе в релиз уйдут файлы другой версии
      - name: Check version
        id: version
        shell: pwsh
        run: |
          $project = [xml](Get-Content -LiteralPath Pilot.ClientSdk.csproj -Raw)
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Неверная версия в Pilot.ClientSdk.csproj: $version" }
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Тег $env:GITHUB_REF_NAME не совпадает с Version $version в Pilot.ClientSdk.csproj" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build Pilot.ClientSdk.sln -c Release -p:CopyToPilot=false --nologo

      - name: Test
        run: dotnet test Pilot.ClientSdk.sln -c Release --no-build --nologo

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet pack Pilot.ClientSdk.csproj -c Release --no-build -o artifacts --nologo
          if ($LASTEXITCODE) { throw "dotnet pack завершился с кодом $LASTEXITCODE" }
          Copy-Item "bin/113Pilot.ClientSdk.ext2-$env:VERSION.zip" artifacts/
          Push-Location artifacts
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content SHA256SUMS.txt -Encoding ascii
          Pop-Location
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Encoding UTF8
          $start = [array]::FindIndex($changelog, [Predicate[string]] { param($l) $l.StartsWith("## [$env:VERSION]") })
          if ($start -lt 0) { throw "В CHANGELOG.md нет раздела [$env:VERSION]" }
          $notes = @()
          for ($i = $start + 1; $i -lt $changelog.Count -and -not $changelog[$i].StartsWith('## ['); $i++) { $notes += $changelog[$i] }
          $notes += ''
          $notes += '### Установка'
          $notes += ''
          $notes += "Модуль: загрузите ``113Pilot.ClientSdk.ext2-$env:VERSION.zip`` на сервер Pilot и назначьте его пользователям раньше модулей, которые на нём построены. Разработчикам модулей: ``Pilot.ClientSdk.$env:VERSION.nupkg`` (сборка только для компиляции). Подробнее: [README](https://github.com/PilotOpenTools/PilotClientSdk#установка)."
          $notes | Set-Content -LiteralPath release-notes.md -Encoding UTF8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $files = @(Get-ChildItem artifacts -File | ForEach-Object { $_.FullName })
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --clobber @files
          } else {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "PilotClientSdk $env:GITHUB_REF_NAME" --notes-file release-notes.md @files
          }
          if ($LASTEXITCODE) { throw "gh release завершился с кодом $LASTEXITCODE" }

      # nuget.pkg.github.com требует вход и для чтения, поэтому основной источник для модулей - nuget.org (шаг ниже).
      - name: Push to GitHub Packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($pkg in Get-ChildItem artifacts -Filter *.nupkg) {
            dotnet nuget push $pkg.FullName --source "https://nuget.pkg.github.com/$($env:GITHUB_REPOSITORY_OWNER)/index.json" --api-key $env:GH_TOKEN --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push $($pkg.Name) в GitHub Packages завершился с кодом $LASTEXITCODE" }
          }

      # Политика Trusted Publishing на nuget.org привязана к репозиторию PilotOpenTools/PilotClientSdk и файлу release.yml;
      # имя пользователя nuget.org - переменная репозитория NUGET_USER (Settings / Secrets and variables / Actions / Variables).
      # Публикация необратима: версию можно только скрыть.
      - name: NuGet login
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        if: vars.NUGET_USER != ''
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          foreach ($pkg in Get-ChildItem artifacts -Filter *.nupkg) {
            dotnet nuget push $pkg.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push $($pkg.Name) в nuget.org завершился с кодом $LASTEXITCODE" }
          }

      - name: nuget.org not configured
        if: vars.NUGET_USER == ''
        run: echo "::warning::Пакет не отправлен в nuget.org - задайте переменную репозитория NUGET_USER и политику Trusted Publishing на nuget.org (README, «Выпуск»)."
