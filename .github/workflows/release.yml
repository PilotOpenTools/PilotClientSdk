name: Release

# Тег vX.Y.Z: проверка версии, сборка, тесты и GitHub Release с zip модуля, NuGet-пакетами и контрольными суммами.
# Описание релиза - раздел версии из CHANGELOG.md; без него workflow падает.
# Ручной запуск (Actions / Release / Run workflow) с тегом уже выпущенной версии только отправляет её пакет в nuget.org:
# например, если политика Trusted Publishing появилась после релиза.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег выпущенного релиза, пакет которого отправить в nuget.org (например v2.1.4)'
        required: true

permissions:
  contents: write
  packages: write # GitHub Packages: пакет Pilot.ClientSdk в nuget.pkg.github.com/PilotOpenTools
  id-token: write # Trusted Publishing nuget.org: временный ключ API по токену OIDC, секрет не хранится

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      # Тег должен совпадать с <Version> в Pilot.ClientSdk.csproj, иначе в релиз уйдут файлы другой версии
      - name: Check version
        id: version
        shell: pwsh
        run: |
          $project = [xml](Get-Content -LiteralPath Pilot.ClientSdk.csproj -Raw)
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Неверная версия в Pilot.ClientSdk.csproj: $version" }
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw "Тег $env:GITHUB_REF_NAME не совпадает с Version $version в Pilot.ClientSdk.csproj" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build Pilot.ClientSdk.sln -c Release -p:CopyToPilot=false --nologo

      - name: Test
        run: dotnet test Pilot.ClientSdk.sln -c Release --no-build --nologo

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet pack Pilot.ClientSdk.csproj -c Release --no-build -o artifacts --nologo
          if ($LASTEXITCODE) { throw "dotnet pack завершился с кодом $LASTEXITCODE" }
          dotnet pack Pilot.ClientSdk.csproj -c Release --no-build -p:PackageId=PilotClientSdk -o artifacts --nologo
          if ($LASTEXITCODE) { throw "dotnet pack PilotClientSdk завершился с кодом $LASTEXITCODE" }
          Copy-Item "bin/113Pilot.ClientSdk.ext2-$env:VERSION.zip" artifacts/
          Push-Location artifacts
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content SHA256SUMS.txt -Encoding ascii
          Pop-Location
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Encoding UTF8
          $start = [array]::FindIndex($changelog, [Predicate[string]] { param($l) $l.StartsWith("## [$env:VERSION]") })
          if ($start -lt 0) { throw "В CHANGELOG.md нет раздела [$env:VERSION]" }
          $notes = @()
          for ($i = $start + 1; $i -lt $changelog.Count -and -not $changelog[$i].StartsWith('## ['); $i++) { $notes += $changelog[$i] }
          $notes += ''
          $notes += '### Установка'
          $notes += ''
          $notes += "Модуль: загрузите ``113Pilot.ClientSdk.ext2-$env:VERSION.zip`` на сервер Pilot и назначьте его пользователям раньше модулей, которые на нём построены. Разработчикам модулей: [``PilotClientSdk``](https://www.nuget.org/packages/PilotClientSdk/$env:VERSION) на NuGet.org (сборка только для компиляции). Подробнее: [README](https://github.com/PilotOpenTools/PilotClientSdk#установка)."
          $notes | Set-Content -LiteralPath release-notes.md -Encoding UTF8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $files = @(Get-ChildItem artifacts -File | ForEach-Object { $_.FullName })
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --clobber @files
          } else {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "PilotClientSdk $env:GITHUB_REF_NAME" --notes-file release-notes.md @files
          }
          if ($LASTEXITCODE) { throw "gh release завершился с кодом $LASTEXITCODE" }

      # nuget.pkg.github.com требует вход и для чтения, поэтому основной источник для модулей - nuget.org (шаг ниже).
      - name: Push to GitHub Packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet nuget push "artifacts/Pilot.ClientSdk.$env:VERSION.nupkg" --source "https://nuget.pkg.github.com/$($env:GITHUB_REPOSITORY_OWNER)/index.json" --api-key $env:GH_TOKEN --skip-duplicate

      # Без --skip-duplicate: NuGet.org возвращает 409 и для зарезервированных ID.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: mahach

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet nuget push "artifacts/PilotClientSdk.$env:VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY

  nuget:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Package from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Тег должен быть вида vX.Y.Z: $TAG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "PilotClientSdk.${TAG#v}.nupkg" --pattern SHA256SUMS.txt --dir artifacts
          cd artifacts
          sha256sum --check --ignore-missing SHA256SUMS.txt
          ls -la

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: mahach

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          dotnet nuget push "artifacts/PilotClientSdk.${TAG#v}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
